<!DOCTYPE html>
<html lang="es">
<head>

    <!-- ==================================================================
         DATOS BÁSICOS DE LA PÁGINA
         ================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Contáctenos | Castlerod Law Group PLLC</title>
    <meta name="description" content="Contacte a Castlerod Law Group PLLC en Houston, Texas. Envíenos un mensaje sobre su caso penal y le responderemos. La consulta es gratuita.">

    <!-- ==================================================================
         ÍCONO DE PANTALLA DE INICIO
         El mismo juego de íconos del resto del sitio, para que esta página
         también muestre el escudo de Castlerod si alguien la guarda en su
         teléfono. Los archivos viven en la raíz del sitio, de ahí "../".
         ================================================================== -->
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Castlerod">
    <link rel="manifest" href="site.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Castlerod">
    <meta name="theme-color" content="#101928">

    <!-- ==================================================================
         ESTILOS
         Esta página usa su propia hoja de estilos y no incluye el encabezado,
         la navegación ni el pie de página del sitio, porque se abre en su
         propia pestaña desde los botones "Contáctenos".
         ================================================================== -->
    <link rel="stylesheet" href="../contactUs.css">

    <!-- ==================================================================
         BUSCADORES Y EMPAREJAMIENTO DE IDIOMA
         ================================================================== -->
    <link rel="canonical" href="https://chrisdominguez79.github.io/LawfirmPractice/es/contactUs.html">
    <link rel="alternate" hreflang="en" href="https://chrisdominguez79.github.io/LawfirmPractice/contactUs.html">
    <link rel="alternate" hreflang="es" href="https://chrisdominguez79.github.io/LawfirmPractice/es/contactUs.html">
    <link rel="alternate" hreflang="x-default" href="https://chrisdominguez79.github.io/LawfirmPractice/contactUs.html">

</head>
<body>

    <div class="form-wrapper">

        <!--
        El formulario se envía a Formspree, que reenvía cada mensaje por
        correo al despacho.

        Los valores de "autocomplete" permiten que el teléfono complete el
        nombre, el correo y el número guardados con un solo toque. "aria-label"
        da a cada campo un nombre hablado para los lectores de pantalla, que
        de otro modo faltaría porque el diseño usa texto de marcador de
        posición en lugar de etiquetas visibles.
        -->
        <form class="form" action="https://formspree.io/f/xlgwnakp" method="POST">

            <h2>Contáctenos</h2>

            <input
                type="text"
                name="name"
                placeholder="Nombre Completo"
                aria-label="Nombre completo"
                autocomplete="name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Correo electrónico"
                aria-label="Su correo electrónico"
                autocomplete="email"
                required
            >

            <!-- inputmode="tel" abre el teclado numérico en el teléfono. El
                 script al final da formato (123) 456-7890 mientras escribe. -->
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Número de teléfono"
                aria-label="Su número de teléfono"
                autocomplete="tel"
                inputmode="tel"
                maxlength="14"
                required
            >

            <textarea
                name="message"
                placeholder="Mensaje"
                aria-label="Su mensaje"
                required
            ></textarea>

            <button type="submit">Enviar mensaje</button>

        </form>

    </div>

    <!--
    Formato del número de teléfono.

    Se mantiene aquí en lugar de moverlo a lawfirm.js porque es el único
    script que necesita esta página y pesa menos que una petición adicional.
    -->
    <script>
        (function () {
            "use strict";

            var phoneField = document.getElementById("phone");

            if (!phoneField) {
                return;
            }

            phoneField.addEventListener("input", function (event) {
                /* Elimina todo lo que no sea un dígito y conserva como máximo
                   los diez dígitos de un número estadounidense. */
                var digits = event.target.value.replace(/\D/g, "").slice(0, 10);
                var formatted = digits;

                if (digits.length > 6) {
                    formatted = "(" + digits.slice(0, 3) + ") " +
                                digits.slice(3, 6) + "-" + digits.slice(6);
                } else if (digits.length > 3) {
                    formatted = "(" + digits.slice(0, 3) + ") " + digits.slice(3);
                }

                event.target.value = formatted;
            });
        }());
    </script>

</body>
</html>
